[package]
name = "rustic-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
native = []
tasks-acceptance = ["native", "rustic-tasks-client/tasks-acceptance", "rustic-tasks-contract/tasks-acceptance"]
[dependencies]
rustic-sdk = { path = "../../crates/sdk" }
rustic-tasks-client = { path = "../../crates/tasks-client" }
rustic-tasks-contract = { path = "../../crates/tasks-contract" }
[[bin]]
name = "shell"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false
