# SPDX-License-Identifier: Apache-2.0
name: Workspace checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
      - name: Check workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rustc --version --verbose > artifacts/toolchain.txt
          cargo xtask check 2>&1 | tee artifacts/check.log
      - name: Verify failure detection
        run: bash tools/check-failure.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-checks
          path: |
            artifacts/
            target/x86_64-unknown-none/debug/librustic_kernel.rlib
          if-no-files-found: error
          retention-days: 14
