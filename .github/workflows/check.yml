# SPDX-License-Identifier: Apache-2.0
name: Workspace checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
      - name: Check workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rustc --version --verbose > artifacts/toolchain.txt
          cargo xtask check 2>&1 | tee artifacts/check.log
      - name: Verify failure detection
        run: bash tools/check-failure.sh
      - name: Check finite operation model
        run: python3 -m tools.research.operation_model > artifacts/operation-model.json
      - name: Check service contracts and exported descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv .cache/contracts-venv
          .cache/contracts-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/contracts/requirements.txt
          .cache/contracts-venv/bin/python -m tools.contracts check --output artifacts/service-contracts.json
          .cache/contracts-venv/bin/python -m tools.contracts read-check --output artifacts/read-host-conformance.json
          .cache/contracts-venv/bin/python -m tools.contracts operations-check --output artifacts/operations-host-conformance.json
          .cache/contracts-venv/bin/python -m tools.contracts activity-check --output artifacts/activity-host-correspondence.json
          .cache/contracts-venv/bin/python -m tools.contracts capabilities-check --output artifacts/capabilities-host-shape.json
          .cache/contracts-venv/bin/python -m unittest discover -s tools/contracts/tests -v 2>&1 | tee artifacts/service-contract-tests.log
          .cache/contracts-venv/bin/python -m tools.contracts export --output artifacts/service-descriptors.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-checks
          path: |
            artifacts/
            target/x86_64-unknown-none/debug/librustic_kernel.rlib
          if-no-files-found: error
          retention-days: 14
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare reviewed toolchain
        run: python3 tools/sandbox.py prepare --package-source github
      - name: Verify isolated builds and VM failures
        run: python3 tools/sandbox.py test --revision "$(git rev-parse HEAD)"
      - name: Preserve isolated execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
      - name: Install reference VM tools
        run: python3 tools/environment.py install
      - name: Calibrate and verify native regression detection
        run: python3 tools/measure.py verify --host-label github-r0 --samples 5 --output artifacts/measurements/ci
      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-evidence
          path: artifacts/measurements/
          if-no-files-found: error
          retention-days: 14
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-none
      - name: Install reference VM tools
        run: python3 tools/environment.py install
      - name: Test runner contracts
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify UEFI boot and failures
        run: python3 tools/boot.py test --timeout 45
      - name: Verify delayed device completion and recovery
        run: python3 tools/latency_test.py --image artifacts/boot/recovery-test/rustic-os.img --output artifacts/boot/latency-test
      - name: Check native service contract evidence
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv .cache/contracts-venv
          .cache/contracts-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/contracts/requirements.txt
          .cache/contracts-venv/bin/python -m tools.contracts read-native --evidence artifacts/boot/terminal-test/terminal.json --output artifacts/boot/terminal-test/read-conformance.json
          .cache/contracts-venv/bin/python -m tools.contracts capabilities-native --evidence artifacts/boot/terminal-test/terminal.json --output artifacts/boot/terminal-test/capabilities.json
          .cache/contracts-venv/bin/python -m tools.contracts operations-native --evidence artifacts/boot/recovery-test/recovery.json --output artifacts/boot/recovery-test/operation-conformance.json
          .cache/contracts-venv/bin/python -m tools.contracts activity-native --evidence artifacts/boot/recovery-test/recovery.json --output artifacts/boot/recovery-test/activity-correspondence.json
      - name: Preserve boot evidence and images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-evidence
          path: artifacts/boot/
          if-no-files-found: error
          retention-days: 14
