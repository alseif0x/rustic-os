# SPDX-License-Identifier: Apache-2.0
[workspace]
members = ["kernel", "crates/abi", "crates/sdk", "crates/fs", "crates/file-service", "apps/sdk-probe", "apps/block-probe", "apps/file-server", "apps/supervisor", "apps/shell", "apps/utility", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/alseif0x/rustic-os"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
